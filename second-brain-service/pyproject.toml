[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "second-brain-service"
version = "0.2.0"
description = "Gmail ingestion, search, and MCP service for the second-brain workspace"
requires-python = ">=3.12"
dependencies = [
  "beautifulsoup4==4.13.3",
  "fastmcp==2.14.5",
  "google-api-python-client==2.164.0",
  "google-auth-httplib2==0.2.0",
  "google-auth-oauthlib==1.2.1",
  "openai==1.66.3",
  "pgvector==0.3.6",
  "psycopg[binary]==3.2.6",
  "python-dotenv==1.1.1",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
